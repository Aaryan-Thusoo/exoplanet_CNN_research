training_and_compiling:
  epochs: 6
  batch_size: 64
  learning_rate: 5e-2
  weight_decay: 5e-3
  loss: "binary_crossentropy"
  metrics: ["accuracy"]

cnn_layers:
  - type: "conv1d"
    channels: 32
    kernel_size: 11
    padding: "same"

  - type: "batch_norm"

  - type: "activation"
    activation: "relu"

  - type: "max_pooling1d"
    pool_size: 2

  - type: "dropout"
    rate: 0.2

  - type: "conv1d"
    channels: 64
    kernel_size: 7
    padding: "same"

  - type: "batch_norm"

  - type: "activation"
    activation: "relu"

  - type: "max_pooling1d"
    pool_size: 2

  - type: "dropout"
    rate: 0.2

  - type: "conv1d"
    channels: 128
    kernel_size: 5
    padding: "same"

  - type: "batch_norm"

  - type: "activation"
    activation: "relu"

  - type: "max_pooling1d"
    pool_size: 2

  - type: "dropout"
    rate: 0.25


  - type: "global_avg_pooling1d"

  - type: "dense"
    units: 32
    activation: "relu"

  - type: "dropout"
    rate: 0.3

  - type: "dense"
    units: 1
    activation: "sigmoid"
