        - type: global_max_pooling1d
        - type: dense
          units: 32
          activation: relu
        - type: dropout
          rate: 0.3
        - type: dense
          units: 1
          activation: sigmoid
        training_and_compiling:
          epochs: 10
          batch_size: 32
          learning_rate: 0.0005
          weight_decay: 0.0001
          loss: binary_crossentropy
          metrics:
          - accuracy
