stages:
  #=================================================================
  # Data Preparation
  #=================================================================
  query_data:
    cmd: python scripts/query_data.py
    deps:
      - scripts/query_data.py
      - scripts/helpers/yaml_reading.py
    params:
      - configs/data_process_params.yaml:
          - kep_query_cols
          - eb_table_cols
    outs:
      - data/raw/Kepler_Confirmed_ExoPlanets.csv
      - data/raw/Kepler_Confirmed_EB.csv

  prepare_kepler_exo_data:
    cmd: python scripts/prepare_kepler_exo_data.py
    deps:
      - scripts/prepare_kepler_exo_data.py
      - data/raw/Kepler_Confirmed_ExoPlanets.csv
    params:
      - configs/data_process_params.yaml:
          - exo_input_file
          - exo_skipped_rows
          - exo_output_folder
    outs:
      - data/processed/exo_data

  prepare_kepler_eb_data:
    cmd: python scripts/prepare_kepler_eb_data.py
    deps:
      - scripts/prepare_kepler_eb_data.py
      - data/raw/Kepler_Confirmed_EB.csv
    params:
      - configs/data_process_params.yaml:
          - eb_input_file
          - eb_skipped_rows
          - eb_output_folder
          - shallow_threshold
    outs:
      - data/processed/eb_data

  #=================================================================
  # Binary Model
  #=================================================================
  organize_bi_data:
    cmd: python scripts/binary/organize_bi_data.py
    deps:
      - scripts/binary/organize_bi_data.py
      - scripts/helpers/temp_help_name.py
      - scripts/helpers/yaml_reading.py
      - data/processed/exo_data
      - data/processed/eb_data
    params:
      - configs/data_process_params.yaml:
          - organize_train_ratio
          - organize_val_test_ratio
          - organize_seed
    outs:
      - data/binary_model/train.npz
      - data/binary_model/val.npz
      - data/binary_model/test.npz

  train_bi_cnn:
    cmd: python scripts/binary/train_bi_cnn.py
    deps:
      - scripts/binary/train_bi_cnn.py
      - data/binary_model/train.npz
      - data/binary_model/val.npz
    params:
      - configs/bi_cnn_params.yaml:
          - cnn_layers
          - training_and_compiling
    outs:
      - models/binary_model.keras
    plots:
      - results/binary/bi_training_history.json
    metrics:
      - results/binary/bi_metrics.json

  evaluate_bi_cnn:
    cmd: python scripts/binary/bi_cnn_model_evaluation.py
    deps:
      - scripts/binary/bi_cnn_model_evaluation.py
      - models/binary_model.keras
      - data/binary_model/test.npz
      - results/binary/bi_training_history.json
    params:
      - configs/bi_evaluation_params.yaml:
          - threshold
    outs:
      - results/binary/plots/confusion_matrix.png
      - results/binary/plots/training_accuracy_history.png
      - results/binary/plots/training_loss_history.png
      - results/binary/plots/confidence_histogram.png
      - results/binary/plots/confidence_correct_vs_incorrect.png
      - results/binary/misclassified_results/misclassified_lightcurves.npz
    metrics:
      - results/binary/evaluation.json

  bi_classification_report:
    cmd: python scripts/binary/bi_classification_report.py
    deps:
      - scripts/binary/bi_classification_report.py
      - results/binary/misclassified_results/misclassified_lightcurves.npz
      - data/binary_model/test.npz
      - models/binary_model.keras
    params:
      - configs/bi_evaluation_params.yaml:
          - threshold
    outs:
      - results/binary/misclassified_results/misclassified_lightcurves.html
      - results/binary/misclassified_results/false_positive_high_confidence.html
      - results/binary/misclassified_results/false_negative_high_confidence.html
      - results/binary/misclassified_results/correct_eclipsing_binary.html
      - results/binary/misclassified_results/correct_transit.html

  analyze_bi_misclassified:
    cmd: python scripts/binary/analyze_bi_misclassified.py
    deps:
      - scripts/binary/analyze_bi_misclassified.py
      - scripts/helpers/misclassified_helper.py
      - scripts/helpers/yaml_reading.py
      - results/binary/misclassified_results/misclassified_lightcurves.npz
    params:
      - configs/bi_evaluation_params.yaml:
          - plots_info
    outs:
      - results/binary/misclassified_results/misclassified_plots
      - results/binary/misclassified_results/fp_distribution_stats.json
      - results/binary/misclassified_results/fn_distribution_stats.json

  bi_confidence_group_analysis:
    cmd: python scripts/binary/bi_confidence_group_analysis.py
    deps:
      - scripts/binary/bi_confidence_group_analysis.py
      - scripts/helpers/yaml_reading.py
      - data/binary_model/test.npz
      - models/binary_model.keras
      - data/raw/Kepler_Confirmed_ExoPlanets.csv
      - data/raw/Kepler_Confirmed_EB.csv
    params:
      - configs/bi_evaluation_params.yaml:
          - threshold
          - plots_info
    outs:
      - results/binary/confidence_group_analysis

  train_bi_random_forest:
    cmd: python scripts/binary/train_bi_random_forest.py
    deps:
      - scripts/binary/train_bi_random_forest.py
      - data/binary_model/train.npz
      - data/binary_model/val.npz
      - data/binary_model/test.npz
      - data/raw/Kepler_Confirmed_ExoPlanets.csv
      - data/raw/Kepler_Confirmed_EB.csv
    params:
      - configs/bi_randf_params.yaml:
          - n_estimators
          - seed
          - class_weight
    outs:
      - models/binary_random_forest.pkl
      - results/binary/random_forest/confusion_matrix.png
      - results/binary/random_forest/feature_importance.png
    metrics:
      - results/binary/random_forest/metrics.json

  #=================================================================
  # Multiclass Model
  #=================================================================

  organize_mc_data:
    cmd: python scripts/multiclass/organize_mc_data.py
    deps:
      - scripts/multiclass/organize_mc_data.py
      - scripts/helpers/temp_help_name.py
      - scripts/helpers/yaml_reading.py
      - data/processed/exo_data
      - data/processed/eb_data
    params:
      - configs/data_process_params.yaml:
          - organize_train_ratio
          - organize_val_test_ratio
          - organize_seed
    outs:
      - data/multi_model/train.npz
      - data/multi_model/val.npz
      - data/multi_model/test.npz

  train_mc_cnn:
    cmd: python scripts/multiclass/train_mc_cnn.py
    deps:
      - scripts/multiclass/train_mc_cnn.py
      - data/multi_model/train.npz
      - data/multi_model/val.npz
    params:
      - configs/mc_cnn_params.yaml:
          - cnn_layers
          - training_and_compiling
    outs:
      - models/multi_model.keras
    plots:
      - results/multiclass/mc_training_history.json
    metrics:
      - results/multiclass/mc_metrics.json

  evaluate_mc_cnn:
    cmd: python scripts/multiclass/mc_cnn_model_evaluation.py
    deps:
      - scripts/multiclass/mc_cnn_model_evaluation.py
      - models/multi_model.keras
      - data/multi_model/test.npz
      - results/multiclass/mc_training_history.json
    params:
      - configs/mc_evaluation_params.yaml:
          - threshold
    outs:
      - results/multiclass/plots/confusion_matrix.png
      - results/multiclass/plots/training_accuracy_history.png
      - results/multiclass/plots/training_loss_history.png
      - results/multiclass/plots/confidence_histogram.png
      - results/multiclass/plots/confidence_correct_vs_incorrect.png
      - results/multiclass/misclassified_results/misclassified_lightcurves.npz
    metrics:
      - results/multiclass/evaluation.json
