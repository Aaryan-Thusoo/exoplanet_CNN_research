    params:
      configs/real_cnn_params.yaml:
        cnn_layers:
        - type: conv1d
          channels: 32
          kernel_size: 7
          padding: same
        - type: batch_norm
        - type: activation
          activation: relu
        - type: max_pooling1d
          pool_size: 2
        - type: dropout
