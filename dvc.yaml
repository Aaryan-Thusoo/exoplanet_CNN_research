stages:
  prepare_kepler_exo_data:
    cmd: python scripts/prepare_kepler_exo_data.py
    deps:
      - scripts/prepare_kepler_exo_data.py
      - data/raw/Kepler_Confirmed_ExoPlanets.csv
    params:
      data_processs_params.yaml
    outs:
      - data/processed/exo_data

  prepare_kepler_eb_data:
    cmd: python scripts/prepare_kepler_eb_data.py
    deps:
      - scripts/prepare_kepler_eb_data.py
      - data/raw/Kepler_Confirmed_ExoPlanets.csv #!!!
    params:
      data_process_params.yaml
    outs:
      - data/processed/eb_data

  organize_data:
    cmd: python scripts/organize_data.py
    deps:
      - scripts/organize_data.py
      - data/processed/exo_data
      - data/processed/eb_data
    params:
      - data_process_params.yaml
    outs:
      -  data/processed

  train_real_cnn:
    cmd: python scripts/organize_data.py
    deps:
      - scripts/organize_data.py
      - data/processed
    params:
      - real_cnn_params.yaml
    outs:
      - models/real_model.keras
    metrics:
      - results/real_metrics.json

  evaluate_real_cnn:
    cmd: python scripts/real_cnn_model_evaluation.py
    deps:
      - scripts/real_cnn_model_evaluation.py
      - models/real_model.keras
      - data/processed/test_data.csv
    outs:
      - results/real_conf_matrix.png
      - results/accuracy.png
      - results/loss.png
    metrics:
      - results/evaluation.json